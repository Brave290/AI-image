<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogoAI</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Orbitron', sans-serif;
            font-size: 15px;
            background: #000000;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            letter-spacing: 0.5px;
        }

        .app {
            width: 100%;
            max-width: 850px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        /* Header */
        .header {
            text-align: center;
            padding: 40px 20px 30px;
            border-bottom: 1px solid #333333;
            margin-bottom: 30px;
        }

        .header .logo-icon {
            font-size: 48px;
            margin-bottom: 12px;
            display: block;
        }

        .header h1 {
            font-size: 2.4rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 10px;
            background: linear-gradient(180deg, #ffffff 0%, #999999 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header .subtitle {
            color: #666666;
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Chat Area */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-height: 60vh;
            overflow-y: auto;
            padding: 10px 0;
        }

        .chat-area::-webkit-scrollbar {
            width: 4px;
        }

        .chat-area::-webkit-scrollbar-thumb {
            background: #333333;
            border-radius: 2px;
        }

        /* Messages */
        .message {
            display: flex;
            gap: 14px;
            animation: slideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .msg-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
            border: 1px solid #333333;
            background: #0a0a0a;
        }

        .message.ai .msg-avatar {
            border-color: #ffffff;
        }

        .msg-bubble {
            max-width: 78%;
            padding: 16px 20px;
            border-radius: 16px;
            border: 1px solid #333333;
            background: #0a0a0a;
            line-height: 1.6;
        }

        .message.user .msg-bubble {
            background: #111111;
            border-color: #444444;
            border-bottom-right-radius: 6px;
        }

        .message.ai .msg-bubble {
            border-bottom-left-radius: 6px;
        }

        .msg-bubble p {
            color: #cccccc;
            font-size: 0.9rem;
        }

        .msg-bubble .highlight {
            color: #ffffff;
            font-weight: 700;
            font-size: 1.4rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            display: block;
            margin: 10px 0;
            text-align: center;
        }

        /* Logo Grid */
        .logo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 16px;
            margin-top: 16px;
        }

        .logo-card {
            background: #000000;
            border: 1px solid #333333;
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .logo-card:hover {
            border-color: #ffffff;
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(255, 255, 255, 0.05);
        }

        .logo-card canvas {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 8px;
            display: block;
        }

        .logo-card .download-btn {
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-top: 10px;
            width: 100%;
            transition: all 0.2s ease;
        }

        .logo-card .download-btn:hover {
            background: #cccccc;
        }

        .logo-card .download-btn:active {
            transform: scale(0.96);
        }

        .logo-number {
            font-size: 0.65rem;
            color: #666666;
            letter-spacing: 2px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        /* Typing indicator */
        .typing-dots {
            display: none;
            align-items: center;
            gap: 8px;
            padding: 10px 0;
            color: #666666;
            font-size: 0.75rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .typing-dots.active {
            display: flex;
        }

        .typing-dots .dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #ffffff;
            animation: pulse 1.4s infinite;
        }

        .typing-dots .dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots .dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes pulse {
            0%, 60%, 100% { opacity: 0.3; }
            30% { opacity: 1; }
        }

        /* Input Area */
        .input-bar {
            display: flex;
            gap: 12px;
            margin-top: 30px;
            padding: 16px 0;
            border-top: 1px solid #333333;
            position: sticky;
            bottom: 0;
            background: #000000;
        }

        .input-bar input {
            flex: 1;
            padding: 16px 22px;
            font-size: 0.9rem;
            border-radius: 30px;
            border: 1px solid #333333;
            background: #0a0a0a;
            color: #ffffff;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 1px;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-bar input:focus {
            border-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.1);
        }

        .input-bar input::placeholder {
            color: #444444;
            letter-spacing: 1px;
        }

        .send-btn {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            border: 1px solid #ffffff;
            background: #ffffff;
            color: #000000;
            font-size: 1.3rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .send-btn:hover:not(:disabled) {
            background: #000000;
            color: #ffffff;
        }

        .send-btn:active:not(:disabled) {
            transform: scale(0.94);
        }

        .send-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .warning-text {
            text-align: center;
            color: #444444;
            font-size: 0.65rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-top: 12px;
            display: none;
        }

        .warning-text.visible {
            display: block;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.6rem;
                letter-spacing: 3px;
            }

            .msg-bubble {
                max-width: 88%;
                padding: 12px 16px;
            }

            .logo-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }

            .logo-card {
                padding: 8px;
            }

            .logo-card .download-btn {
                padding: 8px 12px;
                font-size: 0.6rem;
            }
        }

        @media (max-width: 480px) {
            .app {
                padding: 10px;
            }

            .header {
                padding: 20px 10px 20px;
            }

            .header h1 {
                font-size: 1.3rem;
                letter-spacing: 2px;
            }

            .msg-bubble {
                max-width: 92%;
            }

            .msg-bubble .highlight {
                font-size: 1.1rem;
                letter-spacing: 2px;
            }

            .logo-grid {
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }

            .input-bar input {
                padding: 14px 18px;
                font-size: 0.8rem;
            }

            .send-btn {
                width: 44px;
                height: 44px;
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- Header -->
        <div class="header">
            <span class="logo-icon">◆</span>
            <h1>LogoAI</h1>
            <p class="subtitle">Generate • Download • Gone</p>
        </div>

        <!-- Chat Area -->
        <div class="chat-area" id="chatArea">
            <!-- Welcome message -->
            <div class="message ai">
                <div class="msg-avatar">◆</div>
                <div class="msg-bubble">
                    <p>Welcome. I generate unique brand identities.</p>
                    <p style="color: #666666; margin-top: 6px;">Enter your name. Get a new brand + 4 logos. Nothing is saved.</p>
                </div>
            </div>
        </div>

        <!-- Typing indicator -->
        <div class="typing-dots" id="typingDots">
            <span>generating</span>
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
        </div>

        <!-- Warning -->
        <p class="warning-text" id="warningText">Logos exist only in memory. Download before refreshing.</p>

        <!-- Input Bar -->
        <div class="input-bar">
            <input 
                type="text" 
                id="userInput" 
                placeholder="Enter your name..."
                maxlength="30"
                autocomplete="off"
            >
            <button class="send-btn" id="sendBtn">
                ↑
            </button>
        </div>
    </div>

    <script>
        // DOM Elements
        const chatArea = document.getElementById('chatArea');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const typingDots = document.getElementById('typingDots');
        const warningText = document.getElementById('warningText');

        // Brand name generator (rule-based, instant)
        function generateBrandName(name) {
            const prefixes = ['Nex', 'Zyn', 'Vex', 'Aero', 'Lux', 'Nova', 'Zen', 'Onyx', 'Kai', 'Vox'];
            const suffixes = ['ify', 'ara', 'ium', 'eon', 'ora', 'ix', 'ova', 'eus', 'ica', 'aro'];
            const connectors = ['', '.', '_', ''];
            
            const cleanName = name.replace(/[^a-zA-Z]/g, '').toLowerCase();
            const firstPart = cleanName.slice(0, 3);
            const prefix = prefixes[Math.floor(Math.random() * prefixes.length)];
            const suffix = suffixes[Math.floor(Math.random() * suffixes.length)];
            const connector = connectors[Math.floor(Math.random() * connectors.length)];
            
            const variations = [
                prefix + firstPart,
                firstPart + suffix,
                prefix + connector + suffix,
                cleanName.slice(0, 4) + suffix,
                prefix.charAt(0) + '.' + firstPart.charAt(0).toUpperCase() + firstPart.slice(1),
            ];
            
            return variations[Math.floor(Math.random() * variations.length)].toUpperCase();
        }

        // Draw geometric logo on canvas
        function drawLogo(canvas, brandName, style) {
            const ctx = canvas.getContext('2d');
            const size = canvas.width;
            
            // Clear
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, size, size);
            
            // Random seed based on brand name for consistency
            const seed = brandName.split('').reduce((acc, char) => acc + char.charCodeAt(0), 0);
            
            // Draw geometric elements
            ctx.strokeStyle = '#ffffff';
            ctx.fillStyle = '#ffffff';
            ctx.lineWidth = 2;
            
            const cx = size / 2;
            const cy = size / 2;
            
            switch(style) {
                case 0: // Minimalist circles
                    // Outer circle
                    ctx.beginPath();
                    ctx.arc(cx, cy, size * 0.3, 0, Math.PI * 2);
                    ctx.stroke();
                    
                    // Inner circle
                    ctx.beginPath();
                    ctx.arc(cx, cy, size * 0.2, 0, Math.PI * 2);
                    ctx.stroke();
                    
                    // Dot
                    ctx.beginPath();
                    ctx.arc(cx, cy - size * 0.1, 3, 0, Math.PI * 2);
                    ctx.fill();
                    break;
                    
                case 1: // Geometric diamond
                    ctx.beginPath();
                    ctx.moveTo(cx, cy - size * 0.35);
                    ctx.lineTo(cx + size * 0.35, cy);
                    ctx.lineTo(cx, cy + size * 0.35);
                    ctx.lineTo(cx - size * 0.35, cy);
                    ctx.closePath();
                    ctx.stroke();
                    
                    // Inner diamond
                    ctx.beginPath();
                    ctx.moveTo(cx, cy - size * 0.2);
                    ctx.lineTo(cx + size * 0.2, cy);
                    ctx.lineTo(cx, cy + size * 0.2);
                    ctx.lineTo(cx - size * 0.2, cy);
                    ctx.closePath();
                    ctx.fill();
                    break;
                    
                case 2: // Intersecting lines
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 1.5;
                    
                    for(let i = 0; i < 5; i++) {
                        ctx.beginPath();
                        ctx.moveTo(size * 0.1, size * (0.2 + i * 0.15));
                        ctx.lineTo(size * 0.9, size * (0.2 + i * 0.15));
                        ctx.stroke();
                    }
                    
                    for(let i = 0; i < 5; i++) {
                        ctx.beginPath();
                        ctx.moveTo(size * (0.2 + i * 0.15), size * 0.1);
                        ctx.lineTo(size * (0.2 + i * 0.15), size * 0.9);
                        ctx.stroke();
                    }
                    
                    // Accent square
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 3;
                    ctx.strokeRect(cx - size * 0.08, cy - size * 0.08, size * 0.16, size * 0.16);
                    break;
                    
                case 3: // Triangle & bars
                    // Triangle
                    ctx.beginPath();
                    ctx.moveTo(cx, cy - size * 0.3);
                    ctx.lineTo(cx + size * 0.25, cy + size * 0.2);
                    ctx.lineTo(cx - size * 0.25, cy + size * 0.2);
                    ctx.closePath();
                    ctx.stroke();
                    
                    // Horizontal bars
                    for(let i = 0; i < 3; i++) {
                        ctx.fillRect(
                            cx - size * 0.3 + i * size * 0.05,
                            cy + size * 0.3,
                            size * 0.6 - i * size * 0.1,
                            2
                        );
                    }
                    break;
            }
            
            // Draw brand name
            ctx.fillStyle = '#ffffff';
            ctx.font = `bold ${size * 0.08}px "Orbitron", sans-serif`;
            ctx.textAlign = 'center';
            ctx.letterSpacing = '2px';
            
            // Text position based on style
            let textY;
            switch(style) {
                case 0: textY = size * 0.75; break;
                case 1: textY = size * 0.8; break;
                case 2: textY = size * 0.85; break;
                case 3: textY = size * 0.85; break;
                default: textY = size * 0.8;
            }
            
            ctx.fillText(brandName, cx, textY);
            
            // Add subtle border
            ctx.strokeStyle = '#333333';
            ctx.lineWidth = 1;
            ctx.strokeRect(0, 0, size, size);
        }

        // Generate 4 logos
        function generateLogos(brandName) {
            const logoCanvases = [];
            
            for(let i = 0; i < 4; i++) {
                const canvas = document.createElement('canvas');
                canvas.width = 500;
                canvas.height = 500;
                drawLogo(canvas, brandName, i);
                logoCanvases.push(canvas);
            }
            
            return logoCanvases;
        }

        // Add message to chat
        function addMessage(content, type = 'ai') {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            
            const avatar = document.createElement('div');
            avatar.className = 'msg-avatar';
            avatar.textContent = type === 'ai' ? '◆' : '○';
            
            const bubble = document.createElement('div');
            bubble.className = 'msg-bubble';
            
            if (typeof content === 'string') {
                bubble.innerHTML = content;
            } else {
                bubble.appendChild(content);
            }
            
            messageDiv.appendChild(avatar);
            messageDiv.appendChild(bubble);
            chatArea.appendChild(messageDiv);
            
            // Scroll to bottom
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        // Create logo display element
        function createLogoDisplay(logoCanvases, brandName) {
            const container = document.createElement('div');
            
            const title = document.createElement('p');
            title.style.marginBottom = '12px';
            title.style.color = '#cccccc';
            title.style.fontSize = '0.85rem';
            title.style.letterSpacing = '1.5px';
            title.innerHTML = `Generated brand: <span class="highlight" style="display:inline;font-size:1.2rem;">${brandName}</span>`;
            container.appendChild(title);
            
            const grid = document.createElement('div');
            grid.className = 'logo-grid';
            
            logoCanvases.forEach((canvas, index) => {
                const card = document.createElement('div');
                card.className = 'logo-card';
                
                const number = document.createElement('div');
                number.className = 'logo-number';
                number.textContent = `Variant ${index + 1}`;
                
                const img = document.createElement('img');
                img.src = canvas.toDataURL('image/png');
                img.alt = `Logo ${index + 1}`;
                
                const btn = document.createElement('button');
                btn.className = 'download-btn';
                btn.textContent = `Download`;
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const link = document.createElement('a');
                    link.download = `${brandName}_logo_${index + 1}.png`;
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                });
                
                card.appendChild(number);
                card.appendChild(img);
                card.appendChild(btn);
                grid.appendChild(card);
            });
            
            container.appendChild(grid);
            return container;
        }

        // Main generation flow
        async function handleGenerate() {
            const userName = userInput.value.trim();
            if (!userName) return;
            
            // Clear input
            userInput.value = '';
            sendBtn.disabled = true;
            
            // Add user message
            addMessage(`<p>"${userName}"</p>`, 'user');
            
            // Show typing indicator
            typingDots.classList.add('active');
            warningText.classList.remove('visible');
            
            // Simulate AI thinking (for smooth UX)
            await new Promise(resolve => setTimeout(resolve, 800));
            
            // Generate brand name
            const brandName = generateBrandName(userName);
            
            // Generate logos
            const logoCanvases = generateLogos(brandName);
            
            // Hide typing
            typingDots.classList.remove('active');
            
            // Display results
            const logoDisplay = createLogoDisplay(logoCanvases, brandName);
            addMessage(logoDisplay, 'ai');
            
            // Show warning
            warningText.classList.add('visible');
            
            // Re-enable
            sendBtn.disabled = false;
            userInput.focus();
        }

        // Event listeners
        sendBtn.addEventListener('click', handleGenerate);
        
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                handleGenerate();
            }
        });
        
        // Focus input
        userInput.focus();
    </script>
</body>
</html>
